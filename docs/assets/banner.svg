    <circle cx="-165" cy="0" r="4" fill="#33C09E" filter="url(#glow)"/>
    <text x="0" y="5" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" font-weight="bold" fill="#5eead4" text-anchor="middle" letter-spacing="2.5">GEEK ROOM AI GLOBAL HACKATHON</text>
  </g>

